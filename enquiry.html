        <main>
             <div class="enquiry-content">

            <h1>Make an Enquiry</h1>
            <p>Please complete the form below to enquire about our security services.</p>

            <form>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email Address: </label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"required><br><br>

                <label for="service"> Service Required</label> <br>
                <select id="service" name="service">
                    <option value=""> Select a Service</option>
                    <option value="armed-response">Armed Response / Guards</option>
                    <option value="cctv-alarms">CCTV / Alarms</option>
                    <option value="vip-cit">VIP / C.I.T</option>
                    <option value="special-events">Special Events</option>
                    <option value="guarding">Guarding</option>
                    <option value="home-security">Home Security</option>

                </select><br><br>

                <label for="location">Location:</label><br>
                <input type="text" id="location" name="location" required><br><br>

                <label for="message">Your Enquiry</label><br>
                <textarea id="message" name="message" rows="6" cols="40"></textarea><br><br>
                <input type="submit" value="Submit Enquiry">
            </form>
             </div>
